volumes:
  mariadb:
    driver: local

networks:
  internal:

services:
  nginx:
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
      args:
        IMAGE_VERSION: ${NGINX_IMAGE_VERSION}
    container_name: ${CONTAINER_PREFIX}_nginx
    networks:
      - internal
    restart: no
    pull_policy: missing
    ports:
      - ${APP_NGINX_PORT}:80

  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
      args:
        PHP_IMAGE_VERSION: ${PHP_IMAGE_VERSION}
        NODE_IMAGE_VERSION: ${NODE_IMAGE_VERSION}
    container_name: ${CONTAINER_PREFIX}_app
    volumes:
      - ${PWD}:/var/www/project/
    networks:
      - internal
    restart: no
    pull_policy: missing
    ports:
      - ${APP_FRONT_DEV_PORT}:3000
      - ${APP_REVERB_PORT}:8080

  mariadb:
    image: mariadb:${MYSQL_IMAGE_VERSION}
    container_name: ${CONTAINER_PREFIX}_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    networks:
      - internal
    restart: no
    pull_policy: missing


  phpmyadmin:
    image: phpmyadmin:${PMA_IMAGE_VERSION}
    container_name: ${CONTAINER_PREFIX}_pma
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_ROOT_PASSWORD}
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - UPLOAD_LIMIT=${PMA_UPLOAD_LIMIT}
    networks:
      - internal
    restart: no
    pull_policy: missing
    ports:
      - ${PMA_WEB_PORT}:80

  mailpit:
    image: axllent/mailpit
    container_name: ${CONTAINER_PREFIX}_mailpit
    networks:
      - internal
    restart: no
    pull_policy: missing
    ports:
      - ${MAILPIT_UI_PORT}:8025
      - ${MAILPIT_SMTP_PORT}:1025
